<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>The Crucible - OS</title>
    <meta name="theme-color" content="#09090b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Crucible">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background-color: #09090b; color: #e4e4e7;
            /* Keep content clear of the notch / home bar when installed */
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #27272a; border-radius: 20px; }
        @keyframes slideDownFade { from { opacity: 0; transform: translateY(-1rem); } to { opacity: 1; transform: translateY(0); } }
        .animate-toast { animation: slideDownFade 0.3s ease-out forwards; }
        @keyframes floatUp {
            0% { opacity: 0; transform: translate(-50%, 0) scale(0.7); }
            15% { opacity: 1; transform: translate(-50%, -10px) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -80px) scale(1); }
        }
        .animate-float-up { animation: floatUp 1.2s ease-out forwards; }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(7px, -3px); }
            40% { transform: translate(-5px, 2px); }
            60% { transform: translate(3px, -2px); }
            80% { transform: translate(-2px, 1px); }
        }
        .animate-shake { animation: shake 0.5s ease-in-out; }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.5); } 60% { opacity: 1; transform: scale(1.08); } 100% { opacity: 1; transform: scale(1); } }
        .animate-pop-in { animation: popIn 0.5s cubic-bezier(.2,.9,.3,1.3) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }
        @keyframes checkPop { 0% { transform: scale(0.3); } 60% { transform: scale(1.4); } 100% { transform: scale(1); } }
        .animate-check-pop { display: inline-block; animation: checkPop 0.35s ease-out; }
        @keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }
        .xp-shimmer { background-image: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); background-size: 200% 100%; animation: shimmer 2.5s linear infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        // FontAwesome icon: <I n="fire" /> → fa-solid fa-fire; pass r for fa-regular.
        const I = ({ n, r, className = '' }) => <i className={`fa-${r ? 'regular' : 'solid'} fa-${n} ${className}`}></i>;

        const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

        const CHAOS_TASKS = [
            "Implement a basic Transformer block (Multi-head Attention) from scratch in PyTorch without using nn.Transformer.",
            "Write a custom memory allocator in C or C++ and benchmark it against malloc.",
            "Implement a gradient descent optimizer from scratch in vanilla Python and visualize the loss curve.",
            "Find and exploit a vulnerability in a beginner to intermediate CTF challenge.",
            "Refactor your most complex existing script for O(1) space complexity where theoretically possible.",
            "Deploy a small API using Docker and AWS EC2 from scratch in under 45 minutes.",
            "Read the original YOLO (You Only Look Once) paper and summarize its architectural novelty in a one-page flowchart.",
            "Write a web scraper that dynamically bypasses basic rate limiting and rotating proxies.",
            "Implement a k-means clustering algorithm entirely from scratch without scikit-learn.",
            "Write a comprehensive unit test suite achieving 90%+ coverage for a previously untested personal project."
        ];

        const STOIC_QUOTES = [
            "You have power over your mind - not outside events. Realize this, and you will find strength. – Marcus Aurelius",
            "We suffer more often in imagination than in reality. – Seneca",
            "First say to yourself what you would be; and then do what you have to do. – Epictetus",
            "Discipline is the bridge between goals and accomplishment. – Jim Rohn",
            "If it is not right do not do it; if it is not true do not say it. – Marcus Aurelius",
            "No man is free who is not master of himself. – Epictetus",
            "The impediment to action advances action. What stands in the way becomes the way. – Marcus Aurelius"
        ];

        const DEFAULT_MASTER_DB = {
            Academics: [
                "Study Advanced Linear Algebra concepts for 1 hour.",
                "Review core Data Structures & Algorithms (solve 2 Leetcode Mediums).",
                "Read 1 chapter of a core ML textbook (e.g., Bishop, Goodfellow).",
                "Review and refine lecture notes from the most difficult class today."
            ],
            Startup: [
                "Conduct cold outreach to 3 potential early-adopter users.",
                "Ship one user-facing feature, no matter how small.",
                "Review analytics and define the top bottleneck in the user funnel.",
                "Draft a technical spec for the next major product iteration."
            ],
            Health: [
                "Zone 2 Cardio for 45 minutes.",
                "Intense resistance training session (Push/Pull/Legs).",
                "Complete a 15-minute mobility and deep stretching routine.",
                "Zero processed sugar and strict caloric adherence today."
            ],
            Mindset: [
                "Meditate in absolute silence for 15 minutes.",
                "Read 10 pages of a dense philosophical or psychological text.",
                "Journal for 10 minutes analyzing today's emotional responses.",
                "Take a 3-minute cold shower without hesitation."
            ]
        };

        const CATEGORIES = {
            Academics: { icon: 'book-open', color: 'text-blue-400', bar: 'bg-blue-500' },
            Startup: { icon: 'rocket', color: 'text-purple-400', bar: 'bg-purple-500' },
            Health: { icon: 'dumbbell', color: 'text-emerald-400', bar: 'bg-emerald-500' },
            Mindset: { icon: 'brain', color: 'text-zinc-400', bar: 'bg-zinc-400' },
            Chaos: { icon: 'terminal', color: 'text-red-500', bar: 'bg-red-500' }
        };
        const CategoryIcon = ({ cat }) => <I n={CATEGORIES[cat]?.icon || 'circle'} className={CATEGORIES[cat]?.color} />;

        // ---------------------------------------------------------------- ECONOMY
        const TASK_CREDITS = 5;            // paid instantly per task
        const CHAOS_CREDITS = 15;          // paid instantly for chaos (needs proof)
        const PERFECT_BONUS = 15;          // paid instantly when the last task is ticked
        const MISS_PENALTY_PER_TASK = 5;   // doubles with each consecutive failed day (max ×8)
        const FREEZE_COST = 60;            // doubles with each purchase in the same month
        const MAX_FREEZES = 3;
        const WEEKLY_QUOTA = 5;            // perfect days needed per Mon–Sun week
        const WEEKLY_FINE = 50;
        const MAX_LEVEL = 50;              // reach it to Ascend
        const MIN_PROOF_LENGTH = 10;

        // Each milestone grants +1 Streak Shield (not in Hard Mode) and sets the credit multiplier.
        const STREAK_MILESTONES = [
            { days: 3, title: "Kindling", mult: 1.1 },
            { days: 7, title: "Forged", mult: 1.25 },
            { days: 14, title: "Tempered", mult: 1.35 },
            { days: 30, title: "Unbroken", mult: 1.5 },
            { days: 60, title: "Hardened", mult: 1.75 },
            { days: 100, title: "Eternal Flame", mult: 2 }
        ];
        const getMultiplier = (streak) => STREAK_MILESTONES.findLast(m => streak >= m.days)?.mult || 1;

        // Before noon IST pays double, after 10 PM pays half.
        const timeMultiplier = (h) => h < 12 ? 2 : h >= 22 ? 0.5 : 1;

        const penaltyPerTask = (failStreak, hardMode) => MISS_PENALTY_PER_TASK * 2 ** Math.min(failStreak, 3) * (hardMode ? 2 : 1);
        const shieldCost = (buys, month) => FREEZE_COST * 2 ** (buys.month === month ? buys.count : 0);

        // More tasks as you level up; a second Chaos task from Lv 20.
        const getTaskPlan = (level) => ({ extra: level >= 12 ? 2 : level >= 5 ? 1 : 0, chaos: level >= 20 ? 2 : 1 });

        // Ranks are earned by meeting every requirement; 3 failed days in a row demotes one step.
        const req = (label, test) => ({ label, test });
        const RANKS = [
            { title: "Novice", color: "text-zinc-400", reqs: [] },
            { title: "Initiate", color: "text-blue-400", reqs: [req('Level 5', c => c.level >= 5), req('3-day streak', c => c.streak >= 3)] },
            { title: "Architect", color: "text-purple-400", reqs: [req('Level 12', c => c.level >= 12), req('14-day streak', c => c.streak >= 14), req('Chaos Lv 5', c => c.cat.Chaos >= 5)] },
            { title: "Commander", color: "text-emerald-400", reqs: [req('Level 22', c => c.level >= 22), req('30-day streak', c => c.streak >= 30), req('Every category Lv 8', c => Object.values(c.cat).every(l => l >= 8))] },
            { title: "Sovereign", color: "text-amber-400", reqs: [req('Level 35', c => c.level >= 35), req('60-day streak', c => c.streak >= 60), req('Chaos Lv 15', c => c.cat.Chaos >= 15)] }
        ];
        const FALLEN = { title: "Fallen", color: "text-red-500" };

        // Quadratic curves: Lv 10 ≈ 2 weeks, Lv 25 ≈ 4 months, Lv 50 ≈ 1–2 years.
        const xpToNext = (level) => 60 + 2 * level * level;
        const categoryXpToNext = (level) => 20 + level * level;
        const getLevelInfo = (xp, costFn = xpToNext) => {
            let level = 1, current = Math.max(0, xp);
            while (level < MAX_LEVEL && current >= costFn(level)) current -= costFn(level++);
            return { level, current, needed: costFn(level), progress: level >= MAX_LEVEL ? 1 : current / costFn(level) };
        };

        // ---------------------------------------------------------------- DATES (IST day boundaries)
        const IST = 'Asia/Kolkata';
        const getISTISODate = () => new Date().toLocaleDateString('en-CA', { timeZone: IST });
        const isoToUTC = (iso) => Date.UTC(...iso.split('-').map((n, i) => n - (i === 1)));
        const addDays = (iso, n) => new Date(isoToUTC(iso) + n * 86400000).toISOString().slice(0, 10);
        const daysBetween = (a, b) => Math.round((isoToUTC(b) - isoToUTC(a)) / 86400000);
        const dayOfWeek = (iso) => new Date(isoToUTC(iso)).getUTCDay();
        const weekStartOf = (iso) => addDays(iso, -((dayOfWeek(iso) + 6) % 7));  // Monday
        const isoToDisplay = (iso) => new Date(isoToUTC(iso)).toLocaleDateString('en-US', { timeZone: 'UTC', year: 'numeric', month: 'short', day: 'numeric' });
        // Old saves stored dates as "Sep 18, 2026".
        const displayToISO = (str) => {
            const d = new Date(str);
            return !str || isNaN(d) ? null : `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };
        const getISTClock = () => {
            const parts = new Intl.DateTimeFormat('en-US', { timeZone: IST, hour: 'numeric', minute: 'numeric', hour12: false }).formatToParts(new Date());
            const get = (type) => Number(parts.find(p => p.type === type).value);
            return { h: get('hour') % 24, m: get('minute') };
        };

        // ---------------------------------------------------------------- STORAGE
        const loadJSON = (key, fallback) => {
            try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
        };
        const usePersisted = (key, init) => {
            const [value, setValue] = useState(() => loadJSON(key, null) ?? (typeof init === 'function' ? init() : init));
            useEffect(() => { localStorage.setItem(key, JSON.stringify(value)); }, [key, value]);
            return [value, setValue];
        };
        // ---- Backup & sync: all progress except the Gemini key, as one JSON file.
        const BACKUP_EXCLUDE = ['crucible_gemini_key'];
        const backupKeys = () => Object.keys(localStorage).filter(k => k.startsWith('crucible_') && !BACKUP_EXCLUDE.includes(k));
        const snapshot = () => Object.fromEntries(backupKeys().map(k => [k, localStorage.getItem(k)]));
        const summarizeBackup = (data) => {
            const get = (k) => { try { return JSON.parse(data[k]); } catch { return undefined; } };
            return `Level ${getLevelInfo(get('crucible_xp') || 0).level} · ${get('crucible_credits') ?? 100} CR · ${get('crucible_streak') ?? 0}-day streak`;
        };
        const exportProgress = async () => {
            const name = `crucible-backup-${getISTISODate()}.json`;
            const file = new File([JSON.stringify({ app: 'the-crucible', version: 1, exportedAt: new Date().toISOString(), data: snapshot() })], name, { type: 'application/json' });
            // Phones: share sheet (WhatsApp, Drive, email...). Desktop: plain download.
            if (matchMedia('(pointer: coarse)').matches && navigator.canShare?.({ files: [file] })) {
                try { await navigator.share({ files: [file], title: 'The Crucible backup' }); return 'shared'; }
                catch (e) { if (e.name === 'AbortError') return 'cancelled'; }
            }
            const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(file), download: name });
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            return 'downloaded';
        };
        const readBackup = async (file) => {
            const backup = JSON.parse(await file.text());
            if (backup?.app !== 'the-crucible' || typeof backup.data !== 'object') throw new Error("that's not a Crucible backup file");
            return backup;
        };
        const applyBackup = (backup) => {
            backupKeys().forEach(k => localStorage.removeItem(k));
            Object.entries(backup.data).forEach(([k, v]) => { if (k.startsWith('crucible_') && !BACKUP_EXCLUDE.includes(k)) localStorage.setItem(k, v); });
            location.reload();  // reload before React writes its old state back
        };

        const historyFromLogbook = () => Object.fromEntries(loadJSON('crucible_logbook', []).map(e => [
            displayToISO(e.date), { done: e.tasks.filter(t => t.completed).length, total: e.tasks.length, perfect: !!e.success }
        ]).filter(([iso]) => iso));

        // ---------------------------------------------------------------- FEEDBACK
        const Sfx = (() => {
            let ctx = null;
            const tone = (freq, start, dur, type, vol) => {
                ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
                const t0 = ctx.currentTime + start, osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, t0);
                gain.gain.setValueAtTime(0.0001, t0);
                gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
                osc.connect(gain).connect(ctx.destination);
                osc.start(t0);
                osc.stop(t0 + dur + 0.05);
            };
            const seq = (type, vol, notes) => () => notes.forEach(([f, t, d]) => tone(f, t, d, type, vol));
            return {
                tick: seq('sine', 0.14, [[660, 0, 0.08], [990, 0.06, 0.16]]),
                untick: seq('sine', 0.08, [[440, 0, 0.08], [330, 0.06, 0.12]]),
                chaos: seq('sawtooth', 0.06, [[220, 0, 0.1], [330, 0.07, 0.1], [440, 0.14, 0.1], [880, 0.21, 0.35]]),
                perfect: seq('triangle', 0.16, [[523, 0, 0.15], [659, 0.12, 0.15], [784, 0.24, 0.15], [1047, 0.36, 0.45]]),
                levelUp: seq('square', 0.05, [[392, 0, 0.12], [523, 0.1, 0.12], [659, 0.2, 0.12], [784, 0.3, 0.12], [1047, 0.42, 0.55]]),
                shield: seq('triangle', 0.12, [[880, 0, 0.1], [1320, 0.08, 0.3]]),
                warn: seq('triangle', 0.14, [[196, 0, 0.2], [147, 0.18, 0.35]])
            };
        })();
        const burst = (opts) => window.confetti?.({ disableForReducedMotion: true, ...opts });

        // Installed PWAs (and Android Chrome) can only notify through the service worker.
        const notify = async (body) => {
            if (window.Notification?.permission !== 'granted') return;
            try {
                const reg = await navigator.serviceWorker?.getRegistration();
                if (reg) reg.showNotification('The Crucible', { body, icon: 'icon-192.png', badge: 'icon-192.png' });
                else new Notification('The Crucible', { body });
            } catch {}
        };
        const vibrate = (pattern) => navigator.vibrate?.(pattern);

        // The Gemini key is entered in Progress → Settings and stored only on this device,
        // so the hosted file never contains it.
        const getGeminiKey = () => loadJSON('crucible_gemini_key', '');

        // Falls back to the offline list on any failure (no key, bad key, busy model, network, 8s timeout).
        const fetchGeminiChaosTask = async () => {
            if (!getGeminiKey()) return pick(CHAOS_TASKS);
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${getGeminiKey()}`, {
                    method: 'POST',
                    signal: AbortSignal.timeout(8000),
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{
                        text: "You are a ruthless, elite productivity and AI/ML conditioning coach. Generate exactly ONE extreme difficulty task suitable for a first-year multidisciplinary engineering student chasing elite status (focusing on AI/ML, Startups, or Systems Engineering). The task must maximize discomfort, require deep work, and take roughly 2 hours. Output strictly the task text, nothing else. No formatting, no intro, no quotes."
                    }] }] })
                });
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || pick(CHAOS_TASKS);
            } catch {
                return pick(CHAOS_TASKS);
            }
        };

        // ---------------------------------------------------------------- SMALL COMPONENTS

        // Rolls the number up/down instead of jumping, flashing green/red.
        function AnimatedNumber({ value, className = '' }) {
            const [display, setDisplay] = useState(value);
            const [flash, setFlash] = useState(null);
            const shownRef = useRef(value);
            useEffect(() => {
                const from = shownRef.current;
                if (from === value) return;
                setFlash(value > from ? 'up' : 'down');
                const start = performance.now();
                let raf, timer;
                const step = (now) => {
                    const t = Math.min(1, (now - start) / 700);
                    shownRef.current = Math.round(from + (value - from) * (1 - Math.pow(1 - t, 3)));
                    setDisplay(shownRef.current);
                    if (t < 1) raf = requestAnimationFrame(step);
                    else timer = setTimeout(() => setFlash(null), 300);
                };
                raf = requestAnimationFrame(step);
                return () => { cancelAnimationFrame(raf); clearTimeout(timer); };
            }, [value]);
            const flashClass = flash === 'up' ? '!text-emerald-400' : flash === 'down' ? '!text-red-400' : '';
            return <span className={`transition-colors duration-300 ${className} ${flashClass}`}>{display}</span>;
        }

        function XpBar({ xp, prestige }) {
            const info = getLevelInfo(xp);
            return (
                <div className="mb-8">
                    <div className="flex justify-between items-end mb-1.5 font-mono text-xs uppercase tracking-widest">
                        <span className="text-zinc-400 flex items-center gap-2">
                            <I n="star" className="text-amber-400" /> Level <span className="text-zinc-100 text-base font-bold">{info.level}</span>
                            {prestige > 0 && <span className="text-fuchsia-400" title={`Ascended ${prestige}× · +${prestige * 10}% XP`}>{'✦'.repeat(Math.min(prestige, 5))}{prestige > 5 ? `×${prestige}` : ''}</span>}
                        </span>
                        <span className="text-zinc-500">{info.level >= MAX_LEVEL ? <span className="text-fuchsia-400">MAX · Ascend in Progress</span> : <><span className="text-zinc-300">{info.current}</span> / {info.needed} XP</>}</span>
                    </div>
                    <div className="h-2.5 bg-zinc-900 border border-zinc-800 rounded-full overflow-hidden">
                        <div className="h-full bg-gradient-to-r from-amber-600 via-amber-400 to-yellow-300 transition-all duration-700 ease-out relative rounded-full" style={{ width: `${Math.max(2, info.progress * 100)}%` }}>
                            <div className="absolute inset-0 xp-shimmer" />
                        </div>
                    </div>
                </div>
            );
        }

        const HEATMAP_LEGEND = [['bg-zinc-900', 'None'], ['bg-red-900/70', 'Failed'], ['bg-emerald-900', 'Partial'], ['bg-emerald-500', 'Perfect'], ['bg-sky-500/80', 'Shielded']];

        function Heatmap({ history, todayISO, todayStats, weeks = 18 }) {
            const start = addDays(todayISO, -((weeks - 1) * 7 + dayOfWeek(todayISO)));
            const describe = (iso) => {
                if (iso > todayISO) return ['bg-transparent', ''];
                const isToday = iso === todayISO;
                const rec = isToday ? todayStats : history[iso];
                if (!rec || (isToday && !rec.total)) return ['bg-zinc-900', 'No data'];
                if (rec.frozen) return ['bg-sky-500/80', 'Shield used'];
                if (rec.perfect) return ['bg-emerald-500', `Perfect ${rec.done}/${rec.total}`];
                if (!rec.total) return ['bg-red-950', 'Missed'];
                const label = `${rec.done}/${rec.total}`, ratio = rec.done / rec.total;
                if (ratio === 0) return [isToday ? 'bg-zinc-800' : 'bg-red-900/70', label];
                return [ratio < 0.5 ? 'bg-emerald-900' : 'bg-emerald-700', label];
            };
            return (
                <div className="overflow-x-auto custom-scrollbar pb-1">
                    <div className="flex gap-[3px] w-max">
                        {Array.from({ length: weeks }, (_, w) => (
                            <div key={w} className="flex flex-col gap-[3px]">
                                {Array.from({ length: 7 }, (_, d) => {
                                    const iso = addDays(start, w * 7 + d);
                                    const [cls, label] = describe(iso);
                                    return <div key={iso} title={label && `${isoToDisplay(iso)}: ${label}`}
                                        className={`w-3 h-3 sm:w-3.5 sm:h-3.5 rounded-[3px] ${cls} ${iso === todayISO ? 'ring-1 ring-amber-400 ring-offset-1 ring-offset-[#09090b]' : ''}`} />;
                                })}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function WeeklyQuota({ week, tracked }) {
            const perfect = week.filter(d => d.perfect).length;
            const open = week.filter(d => d.open).length;
            const status = !tracked ? ['text-zinc-500', 'Quota starts next Monday']
                : perfect === 7 ? ['text-amber-400', 'Perfect Week secured']
                : perfect >= WEEKLY_QUOTA ? ['text-emerald-400', `Quota met · ${7 - perfect} more for a Perfect Week`]
                : perfect + open < WEEKLY_QUOTA ? ['text-red-400', `Quota lost · −${WEEKLY_FINE} CR on Sunday night`]
                : ['text-zinc-400', `${WEEKLY_QUOTA - perfect} more perfect day${WEEKLY_QUOTA - perfect > 1 ? 's' : ''} needed · miss it: −${WEEKLY_FINE} CR`];
            return (
                <div className="flex flex-wrap items-center gap-3 p-3 rounded-lg border border-zinc-800 bg-zinc-900/40">
                    <span className="text-[10px] font-mono uppercase tracking-widest text-zinc-500">Week {perfect}/7</span>
                    <div className="flex gap-1">
                        {week.map(d => (
                            <div key={d.iso} title={isoToDisplay(d.iso)}
                                className={`w-6 h-6 rounded text-[9px] font-mono flex items-center justify-center ${d.perfect ? 'bg-emerald-500 text-emerald-950' : d.open || !tracked ? 'bg-zinc-800 text-zinc-500' : 'bg-red-950 text-red-400'} ${d.today ? 'ring-1 ring-amber-400' : ''}`}>
                                {'MTWTFSS'[week.indexOf(d)]}
                            </div>
                        ))}
                    </div>
                    <span className={`text-xs font-mono ${status[0]}`}>{status[1]}</span>
                </div>
            );
        }

        function RadarChart({ stats }) {
            const c = 110, r = 80;
            const maxLevel = Math.max(5, ...stats.map(s => s.level));
            const point = (i, frac) => {
                const a = -Math.PI / 2 + (i * 2 * Math.PI) / stats.length;
                return [c + Math.cos(a) * r * frac, c + Math.sin(a) * r * frac];
            };
            const polygon = (fracs) => fracs.map((f, i) => point(i, f).join(',')).join(' ');
            return (
                <svg viewBox="-40 -10 300 240" className="w-full max-w-[300px] mx-auto">
                    {[0.25, 0.5, 0.75, 1].map(f => <polygon key={f} points={polygon(stats.map(() => f))} fill="none" stroke="#27272a" />)}
                    {stats.map((_, i) => <line key={i} x1={c} y1={c} x2={point(i, 1)[0]} y2={point(i, 1)[1]} stroke="#27272a" />)}
                    <polygon points={polygon(stats.map(s => Math.max(0.06, s.level / maxLevel)))} fill="rgba(251,191,36,0.18)" stroke="#fbbf24" strokeWidth="2" strokeLinejoin="round" />
                    {stats.map((s, i) => {
                        const [x, y] = point(i, 1.22);
                        return <text key={s.label} x={x} y={y} textAnchor="middle" dominantBaseline="middle" fontSize="10" fill="#a1a1aa" fontFamily="ui-monospace, monospace">{s.label.toUpperCase()} {s.level}</text>;
                    })}
                </svg>
            );
        }

        function CelebrationOverlay({ celebration, onDone }) {
            useEffect(() => {
                if (!celebration) return;
                const timer = setTimeout(onDone, 3200);
                return () => clearTimeout(timer);
            }, [celebration?.id]);
            if (!celebration) return null;
            return (
                <div onClick={onDone} className="fixed inset-0 z-[60] bg-black/80 backdrop-blur-sm flex items-center justify-center animate-fade-in cursor-pointer">
                    <div key={celebration.id} className="text-center animate-pop-in px-6">
                        <div className="text-xs font-mono uppercase tracking-[0.4em] text-zinc-400 mb-3">{celebration.kicker}</div>
                        <div className={`text-6xl md:text-8xl font-black tracking-tighter ${celebration.color}`}>{celebration.title}</div>
                        <div className="text-zinc-400 mt-4 text-sm">{celebration.subtitle}</div>
                        <div className="text-zinc-600 mt-10 text-[10px] font-mono uppercase tracking-widest">tap to continue</div>
                    </div>
                </div>
            );
        }

        const Card = ({ icon, iconClass, title, children }) => (
            <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-5">
                <h3 className="text-zinc-200 font-medium uppercase tracking-wider text-sm mb-3 flex items-center gap-2"><I n={icon} className={iconClass} /> {title}</h3>
                {children}
            </div>
        );

        const ProgressBar = ({ progress, className }) => (
            <div className="h-1.5 bg-zinc-950 rounded-full overflow-hidden">
                <div className={`h-full ${className} transition-all duration-700`} style={{ width: `${Math.max(2, Math.min(1, progress) * 100)}%` }} />
            </div>
        );

        // ---------------------------------------------------------------- VIEWS

        function DashboardView({
            dailyTasks, isGenerating, isDayPerfect, onReshuffle, onTaskClick, rewardFor,
            editingTaskId, editTaskText, setEditTaskText, onStartEdit, onSaveEdit,
            proofTaskId, onSubmitProof, onCancelProof,
            streak, freezes, hardMode, failStreak, atRisk, clock, remaining, history, todayISO, week, weekTracked
        }) {
            const done = dailyTasks.length - remaining;
            const total = dailyTasks.length;
            const minutesLeft = 24 * 60 - (clock.h * 60 + clock.m);
            const timeMult = timeMultiplier(clock.h);
            const shieldText = hardMode ? `Hard Mode has no shields: your ${streak}-day streak resets`
                : freezes > 0 ? `a Streak Shield burns to save your ${streak}-day streak` : `your ${streak}-day streak resets to 0`;

            return (
                <div className="space-y-6 w-full max-w-4xl mx-auto">
                    <div className="flex justify-between items-end mb-2 gap-4">
                        <div>
                            <div className="flex items-center gap-4">
                                <h2 className="text-2xl font-bold text-zinc-100 tracking-tight">Today's Crucible</h2>
                                <button onClick={onReshuffle} disabled={isGenerating || done > 0}
                                    className="p-1.5 rounded-md bg-zinc-800 text-zinc-400 hover:text-zinc-100 hover:bg-zinc-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                                    title={done > 0 ? "Locked: you've already completed tasks today" : "Reshuffle Tasks"}>
                                    <I n="rotate-right" className={isGenerating ? 'animate-spin' : ''} />
                                </button>
                            </div>
                            <p className="text-sm text-zinc-500 mt-1">Eliminate friction. Execute with extreme prejudice.</p>
                        </div>
                        {isDayPerfect ? (
                            <div className="px-3 py-1 bg-emerald-900/30 border border-emerald-800 rounded text-emerald-400 text-xs font-mono uppercase tracking-widest animate-pulse">Protocol Complete</div>
                        ) : total > 0 && !isGenerating && (
                            <div className="text-right font-mono flex-shrink-0">
                                <div className="text-2xl text-zinc-100 font-bold">{done}<span className="text-zinc-600">/{total}</span></div>
                                <div className="text-[10px] text-zinc-500 uppercase tracking-widest">Executed</div>
                            </div>
                        )}
                    </div>

                    <div className="flex flex-wrap gap-2 text-[10px] font-mono uppercase tracking-wider">
                        {timeMult === 2 && <span className="px-2 py-1 rounded border border-amber-800/60 bg-amber-950/30 text-amber-300"><I n="sun" /> Early bird ×2 until noon</span>}
                        {timeMult === 0.5 && <span className="px-2 py-1 rounded border border-indigo-800/60 bg-indigo-950/30 text-indigo-300"><I n="moon" /> Late ×0.5 after 10 PM</span>}
                        {hardMode && <span className="px-2 py-1 rounded border border-red-800/60 bg-red-950/40 text-red-300"><I n="skull" /> Hard Mode ×1.5</span>}
                        {failStreak > 0 && <span className="px-2 py-1 rounded border border-red-900/60 bg-red-950/30 text-red-400"><I n="arrow-trend-down" /> {failStreak} failed in a row · penalty ×{2 ** Math.min(failStreak, 3)} · 3 = demotion</span>}
                    </div>

                    <WeeklyQuota week={week} tracked={weekTracked} />

                    {atRisk && !isGenerating && (
                        <div className="flex items-start gap-3 p-4 rounded-lg border border-orange-800/60 bg-orange-950/30 text-sm animate-fade-in">
                            <I n="hourglass-half" className="text-orange-400 mt-0.5 animate-pulse" />
                            <div>
                                <div className="text-orange-300 font-semibold">
                                    {Math.floor(minutesLeft / 60)}h {minutesLeft % 60}m until midnight · {remaining} task{remaining > 1 ? 's' : ''} left
                                </div>
                                <div className="text-orange-200/60 text-xs mt-1 font-mono">
                                    If the day ended now: −{remaining * penaltyPerTask(failStreak, hardMode)} CR · {streak > 0 ? shieldText : 'no streak to protect yet'}
                                    {failStreak >= 2 && ' · and you get DEMOTED'}
                                </div>
                            </div>
                        </div>
                    )}

                    {isGenerating ? (
                        <div className="flex flex-col items-center justify-center py-20 space-y-4">
                            <I n="terminal" className="text-zinc-600 animate-spin text-3xl" />
                            <p className="text-zinc-500 font-mono text-sm uppercase tracking-widest">Generating Chaos Vector...</p>
                        </div>
                    ) : (
                        <div className="space-y-3">
                            {dailyTasks.map((task) => (
                                <div key={task.id} onClick={(e) => onTaskClick(task, e)}
                                    className={`group relative flex items-start gap-4 p-4 rounded-lg border transition-all duration-300 cursor-pointer overflow-hidden select-none active:scale-[0.99]
                                        ${task.completed ? 'bg-zinc-900/50 border-zinc-800/50 opacity-60'
                                            : task.isChaos ? 'bg-[#110a0a] border-red-900/30 hover:border-red-700/50'
                                            : 'bg-zinc-900/80 border-zinc-800 hover:border-zinc-600'}`}>
                                    <div className={`absolute inset-0 bg-emerald-900/10 transition-transform duration-500 origin-left ${task.completed ? 'scale-x-100' : 'scale-x-0'}`} />
                                    <div className="mt-1 relative z-10 flex-shrink-0 text-xl">
                                        {task.completed
                                            ? <span className="animate-check-pop"><I n="circle-check" className="text-emerald-500" /></span>
                                            : <I r n="circle" className={task.isChaos ? 'text-red-600/70' : 'text-zinc-600 group-hover:text-zinc-400'} />}
                                    </div>
                                    <div className="relative z-10 flex-1 min-w-0">
                                        <div className="flex items-center justify-between mb-1">
                                            <div className="flex items-center gap-2">
                                                <span className="text-sm"><CategoryIcon cat={task.category} /></span>
                                                <span className={`text-xs font-mono uppercase tracking-wider ${task.isChaos ? 'text-red-500 font-bold' : 'text-zinc-500'}`}>
                                                    {task.isChaos ? 'LLM Chaos Injection · proof required' : task.category}
                                                </span>
                                                {task.completed && task.completedAt && <span className="text-[10px] text-emerald-600/70 font-mono ml-2">[{task.completedAt}]</span>}
                                            </div>
                                            <div className="flex items-center gap-2">
                                                {!task.completed && editingTaskId !== task.id && (
                                                    <button onClick={(e) => onStartEdit(task, e)} title="Edit task"
                                                        className="opacity-0 group-hover:opacity-100 text-zinc-500 hover:text-zinc-300 transition-opacity p-1 text-sm"><I n="pen" /></button>
                                                )}
                                                {task.completed ? (
                                                    task.earned > 0 && <span className="text-[10px] font-mono text-emerald-500">+{task.earned} CR</span>
                                                ) : (
                                                    <span className={`text-[10px] font-mono px-1.5 py-0.5 rounded border ${task.isChaos ? 'text-red-400 border-red-900/60 bg-red-950/40' : 'text-amber-400/80 border-amber-900/40 bg-amber-950/20'}`}>
                                                        +{rewardFor(task, clock.h)} CR
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                        {editingTaskId === task.id ? (
                                            <div className="flex items-center gap-2 mt-1" onClick={(e) => e.stopPropagation()}>
                                                <input type="text" autoFocus value={editTaskText}
                                                    onChange={(e) => setEditTaskText(e.target.value)}
                                                    onKeyDown={(e) => e.key === 'Enter' && onSaveEdit(task.id, e)}
                                                    className="flex-1 bg-zinc-950 border border-zinc-700 rounded px-2 py-1.5 text-sm text-zinc-200 focus:outline-none focus:border-emerald-600" />
                                                <button onClick={(e) => onSaveEdit(task.id, e)} className="p-1.5 bg-emerald-900/40 text-emerald-400 hover:bg-emerald-900/80 rounded transition-colors text-sm"><I n="check" /></button>
                                            </div>
                                        ) : (
                                            <p className={`text-sm md:text-base transition-all duration-300 ${task.completed ? 'text-zinc-600 line-through' : 'text-zinc-300'}`}>{task.text}</p>
                                        )}
                                        {task.completed && task.proof && <p className="text-[11px] font-mono text-zinc-500 mt-1 break-all">Proof: {task.proof}</p>}
                                        {proofTaskId === task.id && !task.completed && (
                                            <form className="flex items-center gap-2 mt-3" onClick={(e) => e.stopPropagation()} onSubmit={(e) => onSubmitProof(task, e)}>
                                                <input name="proof" autoFocus required minLength={MIN_PROOF_LENGTH} placeholder={`Proof: repo link or what you built (${MIN_PROOF_LENGTH}+ chars)`}
                                                    className="flex-1 min-w-0 bg-zinc-950 border border-red-900/60 rounded px-2 py-1.5 text-sm text-zinc-200 focus:outline-none focus:border-red-600" />
                                                <button className="px-3 py-1.5 bg-red-900/50 text-red-200 hover:bg-red-800/70 rounded text-xs font-mono uppercase">Seal</button>
                                                <button type="button" onClick={onCancelProof} className="p-1.5 text-zinc-500 hover:text-zinc-300"><I n="xmark" /></button>
                                            </form>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    <section className="pt-8">
                        <div className="flex flex-wrap items-end justify-between gap-3 mb-3">
                            <div>
                                <h3 className="text-sm font-semibold text-zinc-200 uppercase tracking-wider flex items-center gap-2">
                                    <I n="fire" className={streak > 0 ? 'text-orange-500' : 'text-zinc-600'} /> The Chain
                                </h3>
                                <p className="text-xs text-zinc-500 mt-0.5">Every green square is a day you kept your word. Don't break it.</p>
                            </div>
                            <div className="flex flex-wrap gap-3 text-[10px] font-mono uppercase tracking-wider text-zinc-500">
                                {HEATMAP_LEGEND.map(([cls, label]) => <span key={label} className="flex items-center gap-1.5"><span className={`w-2.5 h-2.5 rounded-[2px] ${cls}`} />{label}</span>)}
                            </div>
                        </div>
                        <Heatmap history={history} todayISO={todayISO} todayStats={{ done, total, perfect: isDayPerfect }} />
                    </section>
                </div>
            );
        }

        function ProgressView({
            xp, prestige, onAscend, categoryXp, rank, rankCtx, failStreak, streak, bestStreak, freezes, credits,
            shieldPrice, onBuyFreeze, hardMode, hardModeNext, onToggleHardMode, perfectWeeks, notifPerm, onEnableReminders, hasKey, onSaveKey, onExport, onImport
        }) {
            const stats = Object.entries(CATEGORIES).map(([key, cat]) => ({ key, ...cat, info: getLevelInfo(categoryXp[key] || 0, categoryXpToNext) }));
            const next = STREAK_MILESTONES.find(m => m.days > streak);
            const prevDays = STREAK_MILESTONES.findLast(m => streak >= m.days)?.days || 0;
            const best = Math.max(bestStreak, streak);
            const levelInfo = getLevelInfo(xp);
            const nextRank = RANKS[rank + 1];
            const Stat = ({ value, label, className = 'text-zinc-100' }) => (
                <div><div className={`text-2xl font-mono ${className}`}>{value}</div><div className="text-[10px] text-zinc-500 uppercase tracking-widest">{label}</div></div>
            );

            return (
                <div className="space-y-8 w-full max-w-4xl mx-auto">
                    <div>
                        <h2 className="text-2xl font-bold text-zinc-100 tracking-tight">Progress</h2>
                        <p className="text-sm text-zinc-500 mt-1">Level {levelInfo.level}/{MAX_LEVEL} · {xp} XP this ascension{prestige > 0 && ` · Ascended ${prestige}× (+${prestige * 10}% XP)`}.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="space-y-6">
                            <Card icon="chart-simple" iconClass="text-amber-400" title="Character Sheet">
                                <RadarChart stats={stats.map(s => ({ label: s.key, level: s.info.level }))} />
                                <div className="space-y-3 mt-2">
                                    {stats.map(s => (
                                        <div key={s.key}>
                                            <div className="flex justify-between text-xs font-mono mb-1">
                                                <span className={`flex items-center gap-2 uppercase tracking-wider ${s.color}`}><CategoryIcon cat={s.key} /> {s.key}</span>
                                                <span className="text-zinc-400">Lv {s.info.level} <span className="text-zinc-600">· {s.info.current}/{s.info.needed}</span></span>
                                            </div>
                                            <ProgressBar progress={s.info.progress} className={s.bar} />
                                        </div>
                                    ))}
                                </div>
                            </Card>

                            <Card icon="medal" iconClass={RANKS[rank].color} title="Rank Ladder">
                                <div className="space-y-2 mb-4">
                                    {RANKS.map((r, i) => (
                                        <div key={r.title} className={`flex items-center justify-between text-xs font-mono px-2 py-1.5 rounded ${i === rank ? 'bg-zinc-800' : ''}`}>
                                            <span className={i <= rank ? r.color : 'text-zinc-600'}>{i <= rank ? <I n="check" /> : <I n="lock" />} {r.title}</span>
                                            <span className="text-zinc-600">{r.reqs.map(q => q.label).join(' · ') || 'Start'}</span>
                                        </div>
                                    ))}
                                </div>
                                {nextRank ? (
                                    <div className="text-xs font-mono space-y-1">
                                        <div className="text-zinc-400 mb-1">To reach <span className={nextRank.color}>{nextRank.title}</span>:</div>
                                        {nextRank.reqs.map(q => (
                                            <div key={q.label} className={q.test(rankCtx) ? 'text-emerald-400' : 'text-zinc-500'}><I n={q.test(rankCtx) ? 'square-check' : 'square'} r={!q.test(rankCtx)} /> {q.label}</div>
                                        ))}
                                    </div>
                                ) : <p className="text-xs font-mono text-amber-400">Top rank held. Don't slip.</p>}
                                <p className={`text-xs font-mono mt-3 ${failStreak ? 'text-red-400' : 'text-zinc-600'}`}>Failed days in a row: {failStreak}/3 · 3 = demotion + streak reset</p>
                            </Card>
                        </div>

                        <div className="space-y-6">
                            <Card icon="fire" iconClass="text-orange-500" title="Streak">
                                <div className="grid grid-cols-4 gap-3 text-center mb-4">
                                    <Stat value={streak} label="Current" />
                                    <Stat value={best} label="Best" />
                                    <Stat value={`×${getMultiplier(streak)}`} label="Credits" className="text-amber-400" />
                                    <Stat value={perfectWeeks} label="Perfect wks" className="text-emerald-400" />
                                </div>
                                {next ? (
                                    <>
                                        <div className="flex justify-between text-xs font-mono mb-1">
                                            <span className="text-zinc-400">Next: <span className="text-orange-400">{next.title}</span> (×{next.mult}{!hardMode && ', +1 Shield'})</span>
                                            <span className="text-zinc-500">{next.days - streak} day{next.days - streak > 1 ? 's' : ''}</span>

                                        <ProgressBar progress={(streak - prevDays) / (next.days - prevDays)} className="bg-orange-500" />
                                    </>
                                ) : <p className="text-xs text-amber-400 font-mono">All milestones reached. Eternal.</p>}
                            </Card>

                            <Card icon="skull" iconClass="text-red-500" title="Hard Mode">
                                <p className="text-xs text-zinc-500 mb-3 leading-relaxed">
                                    Credits ×1.5. No Streak Shields: they won't burn and you can't forge or earn them. Missed-task penalties ×2. Switching takes effect at midnight, so you can't dodge a bad day.
                                </p>
                                <div className="flex items-center justify-between gap-3">
                                    <span className={`text-xs font-mono ${hardMode ? 'text-red-400' : 'text-zinc-500'}`}>
                                        {hardMode ? 'ACTIVE' : 'OFF'}{hardModeNext !== hardMode && ` → ${hardModeNext ? 'ON' : 'OFF'} at midnight`}
                                    </span>
                                    <button onClick={onToggleHardMode} className="bg-red-950/60 hover:bg-red-900/60 border border-red-900/60 text-red-300 px-3 py-1.5 rounded text-xs font-mono uppercase">
                                        {hardModeNext ? 'Turn off at midnight' : 'Turn on at midnight'}
                                    </button>
                                </div>
                            </Card>

                            <Card icon="snowflake" iconClass="text-sky-400" title="Streak Shields">
                                <div className="flex items-center gap-2 mb-3 text-2xl">
                                    {Array.from({ length: MAX_FREEZES }, (_, i) => <I key={i} n="snowflake" className={i < freezes && !hardMode ? 'text-sky-400' : 'text-zinc-800'} />)}
                                </div>
                                <p className="text-xs text-zinc-500 mb-4 leading-relaxed">
                                    Burns automatically on a failed or skipped day so your streak survives (penalty still applies). Earned at milestones. The price doubles with each purchase in the same month.
                                </p>
                                <button onClick={onBuyFreeze} disabled={hardMode || credits < shieldPrice || freezes >= MAX_FREEZES}
                                    className="w-full bg-sky-900/40 hover:bg-sky-900/70 border border-sky-800/60 text-sky-300 px-3 py-2 rounded text-xs font-mono uppercase tracking-wider transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                                    {hardMode ? 'Disabled in Hard Mode' : freezes >= MAX_FREEZES ? 'Shields full' : `Forge a shield · ${shieldPrice} CR`}
                                </button>
                            </Card>

                            <Card icon="infinity" iconClass="text-fuchsia-400" title="Ascension">
                                <p className="text-xs text-zinc-500 mb-3 leading-relaxed">

                                </p>
                                <button onClick={onAscend} disabled={levelInfo.level < MAX_LEVEL}

                                </p>
                                {notifPerm === 'granted' ? <p className="text-xs font-mono text-emerald-400">Notifications enabled.</p>
                                    : notifPerm === 'unsupported' ? <p className="text-xs font-mono text-zinc-600">This browser doesn't support notifications.</p>
                                    : <button onClick={onEnableReminders} className="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded text-xs transition-colors">Enable notifications</button>}

                            <Card icon="key" iconClass="text-zinc-400" title="Gemini API Key">
                                <p className="text-xs text-zinc-500 mb-3 leading-relaxed">
