                                </p>
                                <form className="flex gap-2" onSubmit={(e) => { e.preventDefault(); const key = e.target.key.value.trim(); if (key) onSaveKey(key); e.target.reset(); }}>
                                    <input name="key" type="password" autoComplete="off" placeholder={hasKey ? '•••••••• saved · paste to replace' : 'Paste your key'}
                                        className="flex-1 min-w-0 bg-zinc-950 border border-zinc-800 rounded px-3 py-1.5 text-xs text-zinc-300 focus:outline-none focus:border-zinc-600" />
                                    <button className="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded text-xs transition-colors">Save</button>
                                </form>
                                {hasKey && <button onClick={() => onSaveKey('')} className="text-[10px] font-mono uppercase text-zinc-600 hover:text-red-400 mt-2">Remove key</button>}
                            </Card>

                            <Card icon="arrow-right-arrow-left" iconClass="text-emerald-400" title="Backup & Sync">
                                <p className="text-xs text-zinc-500 mb-3 leading-relaxed">
                                    Move your progress between devices: Export here, send the file to your other device, then Import it there. Importing replaces everything on that device. Your Gemini key is never included.
                                </p>
                                <div className="grid grid-cols-2 gap-2">
                                    <button onClick={onExport} className="bg-emerald-950/50 hover:bg-emerald-900/60 border border-emerald-900/60 text-emerald-300 px-3 py-2 rounded text-xs font-mono uppercase tracking-wider transition-colors">
                                        <I n="file-export" /> Export
                                    </button>
                                    <label className="bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-300 px-3 py-2 rounded text-xs font-mono uppercase tracking-wider transition-colors text-center cursor-pointer">
                                        <I n="file-import" /> Import
                                        <input type="file" accept="application/json,.json" onChange={onImport} className="hidden" />
                                    </label>
                                </div>
                            </Card>
                        </div>
                    </div>

                    <div>
                        <h3 className="text-zinc-200 font-medium uppercase tracking-wider text-sm mb-3 flex items-center gap-2"><I n="trophy" className="text-amber-400" /> Streak Milestones</h3>
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
                            {STREAK_MILESTONES.map(m => {
                                const unlocked = best >= m.days;
                                return (
                                    <div key={m.days} className={`rounded-lg border p-3 text-center ${unlocked ? 'border-amber-700/60 bg-amber-950/20' : 'border-zinc-800 bg-zinc-900/40'}`}>
                                        <div className={`text-2xl mb-1 ${unlocked ? 'text-amber-400' : 'text-zinc-700'}`}><I n={unlocked ? 'fire' : 'lock'} /></div>
                                        <div className={`text-xs font-semibold ${unlocked ? 'text-zinc-100' : 'text-zinc-600'}`}>{m.title}</div>
                                        <div className="text-[10px] font-mono text-zinc-500 mt-0.5">{m.days} days · ×{m.mult}</div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    <div className="bg-zinc-900/40 border border-zinc-800/60 rounded-lg p-5 text-xs text-zinc-500 leading-relaxed space-y-1 font-mono">
                        <div className="text-zinc-300 uppercase tracking-wider mb-2">Rules of the Crucible</div>
                        <div>+{TASK_CREDITS} CR per task, +{CHAOS_CREDITS} CR for Chaos (needs written proof). Paid instantly, ×2 before noon, ×0.5 after 10 PM.</div>
                        <div>+{PERFECT_BONUS} CR when the whole day is done. Streak multiplier and Hard Mode ×1.5 apply to everything.</div>
                        <div>At midnight IST: −{MISS_PENALTY_PER_TASK} CR per unfinished task, doubling with each failed day in a row (max ×8). Skipped days count as full fails.</div>
                        <div>3 failed days in a row: you drop one rank and your streak resets, shields or not.</div>
                        <div>Each Mon–Sun week: fewer than {WEEKLY_QUOTA} perfect days = −{WEEKLY_FINE} CR. 7/7 = Perfect Week.</div>
                        <div>More tasks at Lv 5 and Lv 12. A second Chaos task at Lv 20. Tasks lock at midnight: no ticking yesterday.</div>
                    </div>
                </div>
            );
        }

        function DatabaseView({ masterDB, setMasterDB }) {
            const addTask = (cat, e) => {
                e.preventDefault();
                const text = e.target.task.value.trim();
                if (text) setMasterDB(prev => ({ ...prev, [cat]: [...prev[cat], text] }));
                e.target.reset();
            };
            const deleteTask = (cat, idx) => setMasterDB(prev => ({ ...prev, [cat]: prev[cat].filter((_, i) => i !== idx) }));

            return (
                <div className="space-y-8 w-full max-w-4xl mx-auto">
                    <div>
                        <h2 className="text-2xl font-bold text-zinc-100 tracking-tight">Master Database</h2>
                        <p className="text-sm text-zinc-500 mt-1">Configure static variables for daily sampling.</p>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {Object.keys(masterDB).map(cat => (
                            <div key={cat} className="bg-zinc-900 border border-zinc-800 rounded-lg p-5">
                                <div className="flex items-center gap-2 mb-4">
                                    <span className="text-lg"><CategoryIcon cat={cat} /></span>
                                    <h3 className="text-zinc-200 font-medium uppercase tracking-wider text-sm">{cat}</h3>
                                </div>
                                <div className="space-y-2 mb-4 max-h-48 overflow-y-auto pr-2 custom-scrollbar">
                                    {masterDB[cat].length === 0 && <p className="text-zinc-600 text-xs italic">No tasks in this domain.</p>}
                                    {masterDB[cat].map((task, idx) => (
                                        <div key={idx} className="flex justify-between items-start gap-3 group">
                                            <p className="text-xs text-zinc-400 flex-1 leading-relaxed">{task}</p>
                                            <button onClick={() => deleteTask(cat, idx)} className="text-zinc-700 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity text-sm"><I r n="circle-xmark" /></button>
                                        </div>
                                    ))}
                                </div>
                                <form className="flex gap-2" onSubmit={(e) => addTask(cat, e)}>
                                    <input name="task" type="text" placeholder="Add new directive..."
                                        className="flex-1 bg-zinc-950 border border-zinc-800 rounded px-3 py-1.5 text-xs text-zinc-300 focus:outline-none focus:border-zinc-600" />
                                    <button className="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded text-xs transition-colors">Add</button>
                                </form>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function LogbookView({ logbook }) {
            return (
                <div className="space-y-6 w-full max-w-4xl mx-auto">
                    <div>
                        <h2 className="text-2xl font-bold text-zinc-100 tracking-tight">Historical Archive</h2>
                        <p className="text-sm text-zinc-500 mt-1">Review past performance and failures.</p>
                    </div>
                    {logbook.length === 0 ? (
                        <div className="text-center py-12 border border-zinc-800/50 rounded-lg bg-zinc-900/20">
                            <I n="clock-rotate-left" className="text-zinc-700 mx-auto mb-3 text-4xl block" />
                            <p className="text-zinc-500 font-mono text-xs uppercase tracking-wider">Archive is empty.</p>
                        </div>
                    ) : (
                        <div className="space-y-4">
                            {logbook.map((entry, idx) => (
                                <div key={idx} className="bg-zinc-900 border border-zinc-800 rounded-lg overflow-hidden">
                                    <div className={`px-4 py-3 border-b flex justify-between items-center ${entry.success ? 'border-emerald-900/30 bg-emerald-900/10' : entry.frozen ? 'border-sky-900/30 bg-sky-900/10' : 'border-red-900/30 bg-red-900/10'}`}>
                                        <span className="font-mono text-sm text-zinc-300">{entry.date}</span>
                                        <div className="flex items-center gap-3">
                                            <span className={`text-xs font-mono ${entry.creditChange > 0 ? 'text-emerald-400' : 'text-red-400'}`}>{entry.creditChange > 0 ? '+' : ''}{entry.creditChange} CR</span>
                                            {entry.success ? <I n="shield-halved" className="text-emerald-500" /> : entry.frozen ? <I n="snowflake" className="text-sky-400" /> : <I n="triangle-exclamation" className="text-red-500" />}
                                        </div>
                                    </div>
                                    <div className="p-4 space-y-2">
                                        {entry.tasks.map((t, i) => (
                                            <div key={i} className="flex items-start gap-2">
                                                <div className="mt-0.5 text-xs">{t.completed ? <I n="circle-check" className="text-emerald-600" /> : <I r n="circle-xmark" className="text-red-600" />}</div>
                                                <p className={`text-xs ${t.completed ? 'text-zinc-500 line-through' : 'text-zinc-300'} ${t.isChaos ? 'font-medium' : ''}`}>
                                                    {t.isChaos && <span className="text-red-500/70 mr-1">[CHAOS]</span>}
                                                    {t.text}
                                                    {t.completed && t.completedAt && <span className="ml-2 text-[10px] text-emerald-700/60 font-mono no-underline inline-block">(Logged: {t.completedAt})</span>}
                                                    {t.proof && <span className="block text-[10px] text-zinc-500 font-mono no-underline break-all">Proof: {t.proof}</span>}
                                                </p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // ---------------------------------------------------------------- APP
        function App() {
            const [credits, setCredits] = usePersisted('crucible_credits', 100);
            const [streak, setStreak] = usePersisted('crucible_streak', 0);
            const [lastISO, setLastISO] = usePersisted('crucible_last_iso', () => displayToISO(localStorage.getItem('crucible_last_date')) || getISTISODate());
            const [dailyTasks, setDailyTasks] = usePersisted('crucible_daily_tasks', []);
            const [masterDB, setMasterDB] = usePersisted('crucible_master_db', DEFAULT_MASTER_DB);
            const [logbook, setLogbook] = usePersisted('crucible_logbook', []);
            const [quoteOfDay, setQuoteOfDay] = usePersisted('crucible_quote', STOIC_QUOTES[0]);
            const [xp, setXp] = usePersisted('crucible_xp', 0);
            const [categoryXp, setCategoryXp] = usePersisted('crucible_category_xp', {});
            const [history, setHistory] = usePersisted('crucible_history', historyFromLogbook);
            const [freezes, setFreezes] = usePersisted('crucible_freezes', 1);
            const [bestStreak, setBestStreak] = usePersisted('crucible_best_streak', 0);
            const [todayBonus, setTodayBonus] = usePersisted('crucible_today_bonus', 0);
            const [soundOn, setSoundOn] = usePersisted('crucible_sound', true);
            const [lastNudge, setLastNudge] = usePersisted('crucible_last_nudge', '');
            const [rank, setRank] = usePersisted('crucible_rank', 0);
            const [failStreak, setFailStreak] = usePersisted('crucible_fail_streak', 0);
            const [shieldBuys, setShieldBuys] = usePersisted('crucible_shield_buys', { month: '', count: 0 });
            const [started, setStarted] = usePersisted('crucible_started', () => Object.keys(loadJSON('crucible_history', {})).sort()[0] || getISTISODate());
            const [perfectWeeks, setPerfectWeeks] = usePersisted('crucible_perfect_weeks', 0);
            const [hardMode, setHardMode] = usePersisted('crucible_hard_mode', false);
            const [hardModeNext, setHardModeNext] = usePersisted('crucible_hard_mode_next', false);
            const [prestige, setPrestige] = usePersisted('crucible_prestige', 0);
            const [geminiKey, setGeminiKey] = usePersisted('crucible_gemini_key', '');

            const [activeTab, setActiveTab] = useState('dashboard');
            const [isGenerating, setIsGenerating] = useState(false);
            const [toasts, setToasts] = useState([]);
            const [editingTaskId, setEditingTaskId] = useState(null);
            const [editTaskText, setEditTaskText] = useState("");
            const [proofTaskId, setProofTaskId] = useState(null);
            const [floaters, setFloaters] = useState([]);
            const [celebrations, setCelebrations] = useState([]);
            const [shaking, setShaking] = useState(false);
            const [clock, setClock] = useState(getISTClock);
            const [notifPerm, setNotifPerm] = useState(() => window.Notification?.permission || 'unsupported');

            const level = getLevelInfo(xp).level;
            const creditMult = getMultiplier(streak) * (hardMode ? 1.5 : 1);
            const xpMult = 1 + prestige * 0.1;
            const rewardFor = (task, h) => Math.round((task.isChaos ? CHAOS_CREDITS : TASK_CREDITS) * creditMult * timeMultiplier(h));

            const play = (name) => soundOn && Sfx[name]();
            const uid = () => `${Date.now()}-${Math.random()}`;

            const showNotification = useCallback((message, type = 'success') => {
                const id = uid();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 5000);
            }, []);

            const spawnFloater = (x, y, text, className) => {
                const id = uid();
                setFloaters(prev => [...prev, { id, x, y, text, className }]);
                setTimeout(() => setFloaters(prev => prev.filter(f => f.id !== id)), 1250);
            };

            const pushCelebration = useCallback((c) => setCelebrations(prev => [...prev, { ...c, id: uid() }]), []);

            const generateDailyCrucible = useCallback(async () => {
                setIsGenerating(true);
                const plan = getTaskPlan(level);
                const cats = Object.keys(masterDB).filter(cat => masterDB[cat].length > 0);
                const picks = cats.map(cat => [cat, pick(masterDB[cat])]);
                for (let i = 0; i < plan.extra && cats.length; i++) {
                    const cat = pick(cats);
                    const unused = masterDB[cat].filter(t => !picks.some(([, used]) => used === t));
                    picks.push([cat, pick(unused.length ? unused : masterDB[cat])]);
                }
                const tasks = picks.map(([cat, text]) => ({ id: `${cat}-${uid()}`, text, category: cat, completed: false, isChaos: false })).sort(() => Math.random() - 0.5);
                const chaosTexts = await Promise.all(Array.from({ length: plan.chaos }, fetchGeminiChaosTask));
                if (chaosTexts[1] === chaosTexts[0]) chaosTexts[1] = pick(CHAOS_TASKS.filter(t => t !== chaosTexts[0]));
                setDailyTasks([...tasks, ...chaosTexts.map(text => ({ id: `Chaos-${uid()}`, text, category: 'Chaos', completed: false, isChaos: true }))]);
                setQuoteOfDay(pick(STOIC_QUOTES));
                setIsGenerating(false);
            }, [masterDB, level]);

            // Settles the previous day (and any days the app wasn't opened) when the IST date rolls over.
            const checkDayTransition = useCallback(() => {
                const today = getISTISODate();
                if (lastISO === today) return;
                const gap = daysBetween(lastISO, today);
                if (gap < 0) return setLastISO(today);

                let s = streak, f = freezes, run = failStreak, r = rank, weeks = perfectWeeks, cr = 0, logEntry = null;
                const hist = { ...history }, notes = [];

                // A failed or skipped day: shield (if allowed), escalating penalty, demotion on 3 in a row.
                const fail = (iso, done, total, missed) => {
                    const penalty = missed * penaltyPerTask(run, hardMode);
                    const frozen = !hardMode && s > 0 && f > 0;
                    if (frozen) f--; else s = 0;
                    run++;
                    if (run >= 3) {
                        if (r > 0) { r--; notes.push([`3 failed days in a row. Demoted to ${RANKS[r].title}. Streak reset.`, 'error']); }
                        s = 0;
                        run = 0;
                    }
                    hist[iso] = { done, total, perfect: false, frozen };
                    cr -= penalty;
                    return { penalty, frozen };
                };

                if (dailyTasks.length > 0) {
                    const total = dailyTasks.length;
                    const done = dailyTasks.filter(t => t.completed).length;
                    const earnedToday = dailyTasks.reduce((sum, t) => sum + (t.completed ? (t.earned || 0) : 0), 0);
                    let dayChange, frozen = false;

                    if (done === total) {
                        // Days finished before instant rewards existed never got their bonus.
                        dayChange = todayBonus === 0 ? PERFECT_BONUS : 0;
                        cr += dayChange;
                        s += 1;
                        run = 0;
                        hist[lastISO] = { done, total, perfect: true, frozen: false };
                        const milestone = STREAK_MILESTONES.find(m => m.days === s);
                        if (milestone) {
                            if (!hardMode) f = Math.min(MAX_FREEZES, f + 1);
                            pushCelebration({ kicker: `${milestone.days}-day streak`, title: milestone.title, subtitle: `Credits now ×${milestone.mult}${hardMode ? '' : ' · +1 Streak Shield'}`, color: 'text-orange-400' });
                        }
                        notes.push([`Day sealed. Streak ${s} 🔥`, 'success']);
                    } else {
                        const before = s;
                        const res = fail(lastISO, done, total, total - done);
                        dayChange = -res.penalty;
                        frozen = res.frozen;
                        notes.push(frozen ? [`Streak Shield absorbed the miss. ${before}-day streak preserved. −${res.penalty} CR`, 'freeze']
                            : [`Crucible failed.${before > 0 ? ` ${before}-day streak lost.` : ''} −${res.penalty} CR`, 'error']);
                    }
                    logEntry = { date: isoToDisplay(lastISO), tasks: dailyTasks, success: done === total, frozen, creditChange: earnedToday + todayBonus + dayChange };
                }

                // Days the app was never opened count as full fails.
                const planSize = 4 + getTaskPlan(level).extra + getTaskPlan(level).chaos;
                let skippedPenalty = 0;
                for (let i = 1; i < gap; i++) skippedPenalty += fail(addDays(lastISO, i), 0, 0, planSize).penalty;
                if (gap > 1) notes.push([`${gap - 1} day(s) skipped. −${skippedPenalty} CR${s > 0 ? ' · shields held the streak' : ''}.`, s > 0 ? 'freeze' : 'error']);

                // Weekly quota: settle every Mon–Sun week that ended, if it was fully tracked.
                for (let i = 0; i < gap; i++) {
                    const sunday = addDays(lastISO, i);
                    if (dayOfWeek(sunday) !== 0 || addDays(sunday, -6) < started) continue;
                    const perfectDays = Array.from({ length: 7 }, (_, d) => hist[addDays(sunday, d - 6)]?.perfect).filter(Boolean).length;
                    if (perfectDays === 7) {
                        weeks++;
                        pushCelebration({ kicker: 'Mon → Sun, 7/7', title: 'PERFECT WEEK', subtitle: `${weeks} perfect week${weeks > 1 ? 's' : ''} total`, color: 'text-emerald-400' });
                    } else if (perfectDays < WEEKLY_QUOTA) {
                        cr -= WEEKLY_FINE;
                        notes.push([`Weekly quota missed (${perfectDays}/${WEEKLY_QUOTA}). −${WEEKLY_FINE} CR`, 'error']);
                    }
                }

                notes.forEach(([msg, type]) => showNotification(msg, type));
                setCredits(prev => prev + cr);
                setStreak(s);
                setBestStreak(prev => Math.max(prev, s));
                setFreezes(f);
                setFailStreak(run);
                setRank(r);
                setPerfectWeeks(weeks);
                setHardMode(hardModeNext);
                setHistory(hist);
                if (logEntry) setLogbook(prev => [logEntry, ...prev].slice(0, 30));
                setTodayBonus(0);
                setProofTaskId(null);
                setDailyTasks([]);
                setLastISO(today);
                generateDailyCrucible();
            }, [lastISO, dailyTasks, streak, freezes, failStreak, rank, perfectWeeks, history, todayBonus, hardMode, hardModeNext, started, level, generateDailyCrucible, showNotification, pushCelebration]);

            useEffect(() => {
                checkDayTransition();
                const interval = setInterval(checkDayTransition, 30000);
                return () => clearInterval(interval);
            }, [checkDayTransition]);

            useEffect(() => {
                if (dailyTasks.length === 0 && lastISO === getISTISODate()) generateDailyCrucible();
                const interval = setInterval(() => setClock(getISTClock()), 30000);
                return () => clearInterval(interval);
            }, []);

            const completeTask = (task, x, y, proof) => {
                const earned = rewardFor(task, getISTClock().h);
                const completedAt = new Date().toLocaleTimeString('en-US', { timeZone: IST, hour: '2-digit', minute: '2-digit', hour12: true });
                const updated = dailyTasks.map(t => t.id === task.id ? { ...t, completed: true, earned, completedAt, proof } : t);
                const bonus = updated.every(t => t.completed) ? Math.round(PERFECT_BONUS * creditMult) : 0;
                const origin = { x: x / innerWidth, y: y / innerHeight };

                setDailyTasks(updated);
                setCredits(prev => prev + earned + bonus);
                setXp(prev => prev + Math.round((earned + bonus) * xpMult));
                setCategoryXp(prev => ({ ...prev, [task.category]: (prev[task.category] || 0) + earned }));
                if (bonus) setTodayBonus(bonus);

                if (task.isChaos) {
                    spawnFloater(x, y, `+${earned}`, 'text-red-400 text-3xl font-black');
                    play('chaos');
                    vibrate([30, 40, 80]);
                    setShaking(true);
                    setTimeout(() => setShaking(false), 500);
                    burst({ particleCount: 160, spread: 110, startVelocity: 45, origin, colors: ['#ef4444', '#f97316', '#fbbf24', '#ffffff'] });
                } else {
                    spawnFloater(x, y, `+${earned}`, 'text-emerald-400 text-xl font-bold');
                    play('tick');
                    vibrate(25);
                    burst({ particleCount: 35, spread: 60, startVelocity: 25, scalar: 0.8, origin, colors: ['#10b981', '#34d399', '#fbbf24'] });
                }

                if (bonus) setTimeout(() => {
                    play('perfect');
                    vibrate([50, 50, 120]);
                    const colors = ['#10b981', '#fbbf24', '#ffffff'];
                    burst({ particleCount: 90, angle: 60, spread: 60, origin: { x: 0, y: 0.75 }, colors });
                    burst({ particleCount: 90, angle: 120, spread: 60, origin: { x: 1, y: 0.75 }, colors });
                    spawnFloater(innerWidth / 2, innerHeight / 2, `PERFECT DAY +${bonus}`, 'text-amber-300 text-3xl md:text-5xl font-black whitespace-nowrap');
                    showNotification(`Perfect Crucible. +${bonus} bonus credits. Streak +1 locks in at midnight.`, 'gold');
                }, 450);
            };

            const uncompleteTask = (task, x, y) => {
                const refund = (task.earned || 0) + todayBonus;
                setDailyTasks(prev => prev.map(t => t.id === task.id ? { ...t, completed: false, earned: 0, completedAt: null, proof: undefined } : t));
                setCredits(prev => prev - refund);
                setXp(prev => Math.max(0, prev - Math.round(refund * xpMult)));
                setCategoryXp(prev => ({ ...prev, [task.category]: Math.max(0, (prev[task.category] || 0) - (task.earned || 0)) }));
                setTodayBonus(0);
                if (refund) spawnFloater(x, y, `-${refund}`, 'text-red-400 text-lg font-bold');
                play('untick');
            };

            const onTaskClick = (task, e) => {
                // Tasks lock at midnight: settle the old day instead of ticking it.
                if (getISTISODate() !== lastISO) return checkDayTransition();
                if (editingTaskId === task.id) return;
                if (task.completed) return uncompleteTask(task, e.clientX, e.clientY);
                if (task.isChaos) return setProofTaskId(task.id);
                completeTask(task, e.clientX, e.clientY);
            };

            const submitProof = (task, e) => {
                e.preventDefault();
                const proof = e.target.proof.value.trim();
                if (proof.length < MIN_PROOF_LENGTH) return;
                if (getISTISODate() !== lastISO) return checkDayTransition();
                const rect = e.target.getBoundingClientRect();
                setProofTaskId(null);
                completeTask(task, rect.left + rect.width / 2, rect.top, proof);
            };

            const startEditingTask = (task, e) => {
                e.stopPropagation();
                setEditingTaskId(task.id);
                setEditTaskText(task.text);
            };

            const saveEditedTask = (id, e) => {
                e.stopPropagation();
                if (editTaskText.trim() === "") return;
                setDailyTasks(prev => prev.map(t => t.id === id ? { ...t, text: editTaskText } : t));
                setEditingTaskId(null);
            };

            const month = lastISO.slice(0, 7);
            const shieldPrice = shieldCost(shieldBuys, month);
            const buyFreeze = () => {
                if (hardMode || credits < shieldPrice || freezes >= MAX_FREEZES) return;
                setCredits(prev => prev - shieldPrice);
                setFreezes(prev => prev + 1);
                setShieldBuys(prev => ({ month, count: prev.month === month ? prev.count + 1 : 1 }));
                play('shield');
                showNotification(`Streak Shield forged. −${shieldPrice} CR. Next one costs ${shieldPrice * 2} CR this month.`, 'freeze');
            };

            const toggleHardMode = () => {
                const next = !hardModeNext;
                setHardModeNext(next);
                showNotification(next === hardMode ? `Change cancelled. Hard Mode stays ${hardMode ? 'on' : 'off'}.` : `Hard Mode turns ${next ? 'ON' : 'OFF'} at midnight.`, next ? 'error' : 'success');
            };

            const ascend = () => {
                if (level < MAX_LEVEL) return;
                setPrestige(p => p + 1);
                setXp(0);
                maxLevelSeenRef.current = 1;
                pushCelebration({ kicker: 'Ascension', title: `✦ ${prestige + 1}`, subtitle: `Back to Level 1 · +${(prestige + 1) * 10}% XP forever`, color: 'text-fuchsia-400' });
            };

            const onExport = async () => {
                const result = await exportProgress();
                if (result === 'shared') showNotification('Backup shared. Import it on your other device.', 'success');
                if (result === 'downloaded') showNotification('Backup downloaded. Send it to your other device and Import it there.', 'success');
            };

            const onImport = async (e) => {
                const file = e.target.files[0];
                e.target.value = '';  // allow picking the same file again
                if (!file) return;
                try {
                    const backup = await readBackup(file);
                    const ok = confirm(`Replace ALL progress on this device with this backup?

Backup (${new Date(backup.exportedAt).toLocaleString()}):
${summarizeBackup(backup.data)}

This device now:
${summarizeBackup(snapshot())}

This can't be undone. Export this device first if you want to keep it.`);
                    if (ok) applyBackup(backup);
                } catch (err) {
                    showNotification(`Import failed: ${err.message}`, 'error');
                }
            };

            const enableReminders = async () => {
                const permission = await Notification.requestPermission().catch(() => 'denied');
                setNotifPerm(permission);
                showNotification(permission === 'granted' ? 'Notifications enabled for the 9 PM warning.' : 'The browser blocked notifications. Tab-title and in-app warnings still work.', permission === 'granted' ? 'success' : 'error');
            };

            // Level-up celebrations
            const maxLevelSeenRef = useRef(level);
            useEffect(() => {
                if (level > maxLevelSeenRef.current) pushCelebration({ kicker: 'Level up', title: `LVL ${level}`, subtitle: level === 5 || level === 12 ? 'Harder: one more daily task.' : level === 20 ? 'Harder: a second Chaos task.' : 'The work compounds.', color: 'text-amber-400' });
                maxLevelSeenRef.current = Math.max(maxLevelSeenRef.current, level);
            }, [level]);

            // Promotions: one rank at a time, once every requirement is met.
            const rankCtx = { level, streak, cat: Object.fromEntries(Object.keys(CATEGORIES).map(k => [k, getLevelInfo(categoryXp[k] || 0, categoryXpToNext).level])) };
            useEffect(() => {
                const next = RANKS[rank + 1];
                if (!next || !next.reqs.every(q => q.test(rankCtx))) return;
                setRank(rank + 1);
                pushCelebration({ kicker: 'Promoted', title: next.title.toUpperCase(), subtitle: next.reqs.map(q => q.label).join(' · '), color: next.color });
            }, [level, streak, categoryXp, rank]);

            const currentCelebration = celebrations[0];
            useEffect(() => {
                if (!currentCelebration) return;
                play('levelUp');
                vibrate([60, 40, 140]);
                burst({ particleCount: 200, spread: 160, startVelocity: 50, origin: { x: 0.5, y: 0.45 }, colors: ['#fbbf24', '#f59e0b', '#ffffff', '#fb923c'] });
            }, [currentCelebration?.id]);

            // Evening warning: tab title + one in-app/browser alert per day
            const remaining = dailyTasks.filter(t => !t.completed).length;
            const atRisk = remaining > 0 && clock.h >= 21;
            useEffect(() => {
                document.title = !dailyTasks.length ? 'The Crucible - OS' : !remaining ? '✅ The Crucible' : `${atRisk ? '🔥 ' : ''}(${remaining}) The Crucible`;
            }, [remaining, atRisk, dailyTasks.length]);

            useEffect(() => {
                if (!atRisk || lastNudge === lastISO) return;
                setLastNudge(lastISO);
                play('warn');
                showNotification(`${remaining} task${remaining > 1 ? 's' : ''} left before midnight. Don't break the chain.`, 'error');
                notify(`${remaining} task(s) left. Your ${streak}-day streak is at risk 🔥`);
            }, [atRisk, lastISO]);

            const isDayPerfect = dailyTasks.length > 0 && remaining === 0;
            const displayRank = credits < 0 ? FALLEN : RANKS[rank];
            const weekStart = weekStartOf(lastISO);
            const week = Array.from({ length: 7 }, (_, i) => {
                const iso = addDays(weekStart, i);
                const today = iso === lastISO;
                return { iso, today, perfect: today ? isDayPerfect : !!history[iso]?.perfect, open: iso > lastISO || (today && !isDayPerfect) };
            });

            const TOASTS = {
                success: ['bg-emerald-950/90 border-emerald-800 text-emerald-300', 'shield-halved'],
                error: ['bg-red-950/90 border-red-800 text-red-300', 'triangle-exclamation'],
                freeze: ['bg-sky-950/90 border-sky-800 text-sky-300', 'snowflake'],
                gold: ['bg-amber-950/90 border-amber-700 text-amber-300', 'trophy']
            };
            const TABS = [['dashboard', 'Dashboard', 'table-columns'], ['progress', 'Progress', 'chart-simple'], ['database', 'Master DB', 'database'], ['logbook', 'Archive', 'clock-rotate-left']];

            return (
                <div className={`min-h-screen bg-[#09090b] text-zinc-200 selection:bg-zinc-800 font-sans flex flex-col items-center ${shaking ? 'animate-shake' : ''}`}>
                    <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2 w-[calc(100%-2rem)] max-w-md pointer-events-none">
                        {toasts.map(t => (
                            <div key={t.id} className={`animate-toast px-4 py-2 rounded shadow-lg border text-sm font-mono flex items-center gap-2 ${TOASTS[t.type][0]}`}>
                                <I n={TOASTS[t.type][1]} /> {t.message}
                            </div>
                        ))}
                    </div>

                    <div className="fixed inset-0 pointer-events-none z-[55]">
                        {floaters.map(f => <div key={f.id} className={`absolute animate-float-up font-mono drop-shadow-lg ${f.className}`} style={{ left: f.x, top: f.y - 20 }}>{f.text}</div>)}
                    </div>

                    <CelebrationOverlay celebration={currentCelebration} onDone={() => setCelebrations(prev => prev.slice(1))} />

                    <div className="w-full max-w-4xl px-4 py-8 flex flex-col flex-grow">
                        <header className="mb-6 flex flex-col md:flex-row md:items-end justify-between gap-6 border-b border-zinc-800 pb-6">
                            <div>
                                <h1 className="text-4xl font-bold tracking-tighter text-white mb-2">THE CRUCIBLE</h1>
                                <div className="flex items-center gap-2 text-zinc-500 font-mono text-xs uppercase tracking-widest">
                                    <span>Date: {isoToDisplay(lastISO)}</span><span>•</span>
                                    {hardMode ? <span className="text-red-400 flex items-center gap-1"><I n="skull" /> Hard Mode</span> : <span className="flex items-center gap-1"><I n="chart-line" /> OS Active</span>}
                                </div>
                            </div>
                            <div className="grid grid-cols-3 gap-2 sm:flex sm:gap-4">
                                <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-3 sm:min-w-[110px] min-w-0">
                                    <div className="text-[10px] text-zinc-500 uppercase tracking-widest mb-1 flex justify-between items-center"><span>Rank</span><I n="medal" className={displayRank.color} /></div>
                                    <div className={`text-base sm:text-lg font-semibold tracking-wide truncate ${displayRank.color}`}>{displayRank.title}</div>
                                </div>
                                <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-3 sm:min-w-[100px] min-w-0">
                                    <div className="text-[10px] text-zinc-500 uppercase tracking-widest mb-1">Credits</div>
                                    <AnimatedNumber value={credits} className={`text-xl font-mono ${credits < 0 ? 'text-red-500' : 'text-zinc-100'}`} />
                                </div>
                                <div className={`bg-zinc-900 border rounded-lg p-3 sm:min-w-[120px] min-w-0 relative overflow-hidden group ${isDayPerfect ? 'border-orange-700/60' : 'border-zinc-800'}`}>
                                    <div className={`absolute inset-0 bg-orange-500/5 transition-transform ${isDayPerfect ? 'translate-y-0' : 'translate-y-full group-hover:translate-y-0'}`} />
                                    <div className="text-[10px] text-zinc-500 uppercase tracking-widest mb-1 flex justify-between items-center relative z-10 gap-2">
                                        <span>Streak</span>
                                        <I n="fire" className={`${streak > 0 || isDayPerfect ? 'text-orange-500' : 'text-zinc-600'} ${isDayPerfect ? 'animate-pulse' : ''}`} />
                                    </div>
                                    <div className="text-xl font-mono text-zinc-100 relative z-10">{streak} <span className="text-xs text-zinc-600">Days</span></div>
                                    <div className="relative z-10 flex items-center gap-2 mt-1 text-[10px] font-mono">
                                        {creditMult > 1 && <span className="text-amber-400">×{+creditMult.toFixed(2)}</span>}
                                        {!hardMode && <span className="text-sky-400 flex items-center gap-0.5" title="Streak Shields">{Array.from({ length: freezes }, (_, i) => <I key={i} n="snowflake" />)}</span>}
                                        {isDayPerfect && <span className="text-orange-400">+1 at midnight</span>}
                                    </div>
                                </div>
                            </div>
                        </header>

                        <XpBar xp={xp} prestige={prestige} />

                        <div className="flex items-center justify-between gap-2 mb-8">
                            <nav className="flex flex-wrap gap-1 bg-zinc-900/50 p-1 rounded-lg border border-zinc-800/50">
                                {TABS.map(([id, label, icon]) => (
                                    <button key={id} onClick={() => setActiveTab(id)}
                                        className={`flex items-center gap-2 px-3 sm:px-4 py-2 rounded text-sm transition-all ${activeTab === id ? 'bg-zinc-800 text-zinc-100 shadow' : 'text-zinc-500 hover:text-zinc-300'}`}>
                                        <I n={icon} /> <span className="hidden sm:inline">{label}</span>
                                    </button>
                                ))}
                            </nav>
                            <button onClick={() => setSoundOn(s => !s)} title={soundOn ? 'Mute sounds' : 'Unmute sounds'}
                                className="p-2.5 rounded-lg border border-zinc-800/50 bg-zinc-900/50 text-zinc-500 hover:text-zinc-200 transition-colors">
                                <I n={soundOn ? 'volume-high' : 'volume-xmark'} />
                            </button>
                        </div>

                        <main className="flex-grow w-full flex justify-center">
                            {activeTab === 'dashboard' && (
                                <DashboardView dailyTasks={dailyTasks} isGenerating={isGenerating} isDayPerfect={isDayPerfect}
                                    onReshuffle={generateDailyCrucible} onTaskClick={onTaskClick} rewardFor={rewardFor}
                                    editingTaskId={editingTaskId} editTaskText={editTaskText} setEditTaskText={setEditTaskText}
                                    onStartEdit={startEditingTask} onSaveEdit={saveEditedTask}
                                    proofTaskId={proofTaskId} onSubmitProof={submitProof} onCancelProof={(e) => { e.stopPropagation(); setProofTaskId(null); }}
                                    streak={streak} freezes={freezes} hardMode={hardMode} failStreak={failStreak} atRisk={atRisk} clock={clock}
                                    remaining={remaining} history={history} todayISO={lastISO} week={week} weekTracked={weekStart >= started} />
                            )}
                            {activeTab === 'progress' && (
                                <ProgressView xp={xp} prestige={prestige} onAscend={ascend} categoryXp={categoryXp} rank={rank} rankCtx={rankCtx}
                                    failStreak={failStreak} streak={streak} bestStreak={bestStreak} freezes={freezes} credits={credits}
                                    shieldPrice={shieldPrice} onBuyFreeze={buyFreeze} hardMode={hardMode} hardModeNext={hardModeNext}
                                    onToggleHardMode={toggleHardMode} perfectWeeks={perfectWeeks} notifPerm={notifPerm} onEnableReminders={enableReminders}
                                    hasKey={!!geminiKey} onSaveKey={(key) => { setGeminiKey(key); showNotification(key ? 'Gemini key saved on this device.' : 'Gemini key removed. Using the offline task list.', 'success'); }}
                                    onExport={onExport} onImport={onImport} />
                            )}
                            {activeTab === 'database' && <DatabaseView masterDB={masterDB} setMasterDB={setMasterDB} />}
                            {activeTab === 'logbook' && <LogbookView logbook={logbook} />}
                        </main>

                        <footer className="mt-16 pt-8 border-t border-zinc-900 text-center pb-8">
                            <p className="text-zinc-600 italic font-serif text-sm max-w-2xl mx-auto">
                                "{quoteOfDay.split(' – ')[0]}"
                                <span className="block mt-2 text-xs font-sans text-zinc-700 uppercase tracking-widest not-italic">— {quoteOfDay.split(' – ')[1]}</span>
                            </p>
                        </footer>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script>
        // Offline support + installability. Service workers only run over http(s), not file://.
        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
    </script>
</body>
</html>
